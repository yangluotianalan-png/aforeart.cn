<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>建筑专硕选课核对表</title>
    <meta name="description" content="建筑全日制/非全日制专业型硕士选课核对与时间冲突检查" />
    <link rel="stylesheet" href="course-planner.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">建筑 085100</p>
          <h1>专业型硕士选课核对表</h1>
        </div>
        <div class="actions">
          <a class="back-link" href="http://127.0.0.1:4180/butterflies.html#course-planner">返回蝴蝶页面</a>
          <button id="selectMinimum" type="button">一键最低推荐</button>
          <button id="clearSelection" type="button">清空</button>
        </div>
      </header>

      <main class="layout">
        <aside class="course-panel">
          <div class="panel-head">
            <h2>左侧选课</h2>
            <input id="courseSearch" type="search" placeholder="搜索课程名或编号" />
          </div>
          <div class="track-switch" role="group" aria-label="培养类型">
            <button class="active" type="button" data-track="design">设计型</button>
            <button type="button" data-track="research">专题型</button>
          </div>
          <div id="courseList" class="course-list"></div>
        </aside>

        <section class="result-panel">
          <div class="summary-grid" id="summaryGrid"></div>

          <section class="card">
            <div class="section-title">
              <h2>每周课表</h2>
              <span id="selectedCount">0 门</span>
            </div>
            <div class="schedule-tools">
              <label>
                学期
                <select id="termFilter">
                  <option value="all">全部</option>
                  <option value="秋">秋</option>
                  <option value="春">春</option>
                  <option value="秋/春">秋/春</option>
                </select>
              </label>
              <span class="hint">给已选课程填写星期和节次后，会自动检查冲突。</span>
            </div>
            <div id="weeklyTimetable" class="weekly-timetable"></div>
          </section>

          <section class="card">
            <div class="section-title">
              <h2>已选课程明细</h2>
              <span>班级可切换</span>
            </div>
            <div id="scheduleTable" class="schedule-table"></div>
          </section>

          <section class="card">
            <div class="section-title">
              <h2>毕业标准核对</h2>
              <span id="gradStatus">未达标</span>
            </div>
            <div id="requirements" class="requirements"></div>
          </section>

          <section class="card">
            <div class="section-title">
              <h2>系统与 Word 差异</h2>
              <span id="diffCount">0 项</span>
            </div>
            <div id="diffList" class="diff-list"></div>
          </section>
        </section>
      </main>
    </div>

    <script src="course-planner.js"></script>
  </body>
</html>
